<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Band Workouts</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6b6b70;
    --accent: #c2410c;
    --border: #e4e2dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416;
      --card: #1e1e21;
      --text: #ececee;
      --muted: #a0a0a8;
      --accent: #fb923c;
      --border: #2e2e33;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header, main { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 32px; }
  h1 { margin: 0 0 4px; font-size: 2rem; }
  nav { display: flex; gap: 8px; margin: 16px 0 8px; }
  nav a {
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 4px 14px;
    text-decoration: none;
    font-weight: 600;
  }
  nav a:hover { background: var(--accent); color: var(--bg); }
  section { padding: 24px 0; }
  h2 {
    font-size: 1.5rem;
    margin: 0 0 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--accent);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }
  .exercise {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .exercise h3 {
    margin: 0;
    padding: 12px 16px;
    font-size: 1.05rem;
    display: flex;
    gap: 10px;
    align-items: baseline;
  }
  .num { color: var(--accent); font-variant-numeric: tabular-nums; }
  .video { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .no-video {
    aspect-ratio: 16 / 9;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 16px;
    color: var(--muted);
    background: repeating-linear-gradient(45deg, var(--bg), var(--bg) 10px, var(--card) 10px, var(--card) 20px);
  }
  .exercise footer { padding: 8px 16px 12px; font-size: 0.875rem; }
  .exercise footer a { color: var(--muted); }
  @media (max-width: 400px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Band Workouts</h1>
  <nav>
    <a href="#workout-a">Workout A</a>
    <a href="#workout-b">Workout B</a>
  </nav>
</header>
<main>
  <section id="workout-a">
    <h2>Workout A</h2>
    <div class="grid" data-workout="A"></div>
  </section>
  <section id="workout-b">
    <h2>Workout B</h2>
    <div class="grid" data-workout="B"></div>
  </section>
</main>
<script>
  const workouts = {
    A: [
      ["Band squat", "duP-UZsfOaQ"],
      ["Band chest press", "Rn-hf5iauTc"],
      ["Band Romanian deadlift", "DzgMIPH9_sw"],
      ["Seated band row", "IjcDCVPChB8"],
      ["Band overhead press", "Ky8S6SCcyxI"],
      ["Pallof press", "1CnGtWXfQ8w"]
    ],
    B: [
      ["Band split squat", "1w_z8AkR7ak"],
      ["Push-up", null],
      ["Band glute bridge", "bmfZEHD7IEI"],
      ["Band lat pulldown", "_97pmOC2tzE"],
      ["Band face pull", "JBpj9-3tP0c"],
      ["Band biceps curl", "3g-1J2KkX_8"]
    ]
  };

  for (const [key, exercises] of Object.entries(workouts)) {
    const grid = document.querySelector(`[data-workout="${key}"]`);
    exercises.forEach(([name, id], i) => {
      const card = document.createElement("article");
      card.className = "exercise";

      const h3 = document.createElement("h3");
      h3.innerHTML = `<span class="num">${i + 1}</span>`;
      h3.append(name);
      card.append(h3);

      if (id) {
        const wrap = document.createElement("div");
        wrap.className = "video";
        const iframe = document.createElement("iframe");
        iframe.src = `https://www.youtube-nocookie.com/embed/${id}`;
        iframe.title = name;
        iframe.loading = "lazy";
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        iframe.allowFullscreen = true;
        wrap.append(iframe);
        card.append(wrap);

        const footer = document.createElement("footer");
        footer.innerHTML = `<a href="https://youtu.be/${id}" target="_blank" rel="noopener">Open on YouTube</a>`;
        card.append(footer);
      } else {
        const none = document.createElement("div");
        none.className = "no-video";
        none.textContent = "No video for this exercise";
        card.append(none);
      }

      grid.append(card);
    });
  }
</script>
</body>
</html>
